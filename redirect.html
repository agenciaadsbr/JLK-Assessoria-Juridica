:root{
  --navy-950:#081729;--navy-900:#0E2A4D;--gold-500:#C2A279;--gold-300:#E1CBA6;
  --paper:#F8F5EE;--wa-green:#25D366;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;font-family:'Public Sans',-apple-system,Segoe UI,Arial,sans-serif;
  background:radial-gradient(circle at 30% 20%, var(--navy-900) 0%, var(--navy-950) 70%);
  color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:32px;
}
.card{max-width:440px;}
.mark{width:auto;height:52px;margin:0 auto 32px;object-fit:contain;}
h1{
  font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:1.7rem;line-height:1.35;margin:0 0 14px;
}
h1 em{font-style:italic;color:var(--gold-300);font-weight:400;}
p{color:rgba(248,245,238,0.75);font-size:1rem;line-height:1.6;margin:0 0 34px;}
.loader{
  width:52px;height:52px;margin:0 auto 34px;position:relative;
}
.loader svg{width:100%;height:100%;transform:rotate(-90deg);}
.loader circle{fill:none;stroke-width:3;}
.loader .track{stroke:rgba(255,255,255,0.12);}
.loader .bar{
  stroke:var(--gold-500);stroke-linecap:round;
  stroke-dasharray:150.8;stroke-dashoffset:150.8;
  animation:loadbar 3s linear forwards;
}
@keyframes loadbar{to{stroke-dashoffset:0;}}
.loader .wa-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--wa-green);}
@media (prefers-reduced-motion: reduce){.loader .bar{animation-duration:0.01s;}}

.fallback{
  display:inline-flex;align-items:center;gap:10px;margin-top:6px;padding:15px 26px;border-radius:3px;
  background:var(--wa-green);color:#fff;font-weight:600;text-decoration:none;font-size:0.95rem;
  opacity:0;pointer-events:none;transition:opacity .4s ease;
}
.fallback.show{opacity:1;pointer-events:auto;}
.status{font-size:0.82rem;color:rgba(248,245,238,0.45);margin-top:22px;}
</style>
</head>
